[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = ["@openzeppelin/contracts=lib/openzeppelin-contracts/contracts"]
ffi = true
fs_permissions = [
  { access = "read", path = "./broadcast" },
  { access = "read", path = "./reports" },
  { access = "read", path = "./img/" },
]


[rpc_endpoints]
SEPOLIA_RPC_URL = "https://eth-sepolia.g.alchemy.com/v2/Pnh0S2CY_Sq0C6oaou2t3"

[etherscan]
sepolia = { key = "PNXI9TJY9T95E95WYVCQFDMYE7GNV7IEKN" }


